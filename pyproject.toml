[project]
name = "bbschain"
version = "0.0.1"
description = "A blockchain-backed BBS, built step by step for learning."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
# 런타임 의존성은 Phase 2(FastAPI)부터 생긴다. Phase 0/1 은 표준 라이브러리만 쓴다.
dependencies = []

[project.scripts]
# Phase 1 Lab 1.5 에서 실제 CLI 가 붙는 자리. 지금은 스텁을 가리킨다.
bbschain = "bbschain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bbschain"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.100",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.mypy]
python_version = "3.12"
files = ["src"]

# core/ 만 strict. 나머지 패키지는 Phase 가 진행되며 점진적으로 조인다.
[[tool.mypy.overrides]]
module = "bbschain.core.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
no_implicit_reexport = true
warn_return_any = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true

[tool.pytest.ini_options]
# `pytest` 를 인자 없이 부르면 여기만 수집한다.
# tests/unit · tests/integration 은 Phase 1 구현을 기다리는 테스트라 지금은 전부 실패한다
# (그게 정상이다 — tests/conftest.py 참고). 그래서 기본 실행에서 뺀다.
# 경로를 명시하면(`uv run pytest tests/unit/test_merkle.py`) 그대로 수집되고 실행된다.
# Phase 1 구현이 끝나면 이 값을 ["tests"] 로 되돌린다.
testpaths = ["tests/test_smoke.py"]
addopts = "-ra"
