name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 연달아 push 하면 앞 실행을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          # requires-python 은 ">=3.12" 라 더 높은 버전도 통과한다.
          # CI 판정기를 고정하려고 여기서 3.12 를 못 박는다 (UV_PYTHON 으로 들어간다).
          python-version: "3.12"

      # --locked: uv.lock 과 pyproject.toml 이 어긋나면 조용히 재해결하지 말고 실패시킨다.
      # CI 와 로컬이 같은 의존성 집합을 쓰는지가 "내 컴퓨터에서는 되는데요"를 막는 지점이다.
      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check

      # 인자를 주지 않으므로 pyproject 의 testpaths(= 스모크)만 수집된다.
      # Phase 1 테스트는 구현이 생길 때까지 기본 실행에서 빠져 있다 (pyproject.toml 주석 참고).
      - name: Test
        run: uv run pytest -v
